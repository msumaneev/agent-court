[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-court"
version = "0.2.0"
description = "Adversarial Trajectory Auditor & Constitutional Patch Engine for Autonomous AI Coding Agents"
readme = "README.md"
authors = [
    { name = "Mikhail Sumaneev", email = "ms@contlog.ru" }
]
license = "MIT"
requires-python = ">=3.10"
keywords = [
    "ai-agents", "evaluation", "llm-judge", "cursor", "claude-code",
    "antigravity", "governance", "trajectory-analysis", "code-generation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "jinja2>=3.1.3",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
llm = [
    "openai>=1.20.0",
    "anthropic>=0.25.0",
]
github = [
    "pygithub>=2.3.0",
]
all = [
    "agent-court[llm,github]"
]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.9.0",
    "ruff>=0.4.0",
]

[project.scripts]
agent-court = "agent_court.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_court"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
